name: Reset kuota WhatsApp bulanan

# Reset kuota included tiap hari. RPC hanya me-reset baris yang period_end-nya
# sudah lewat; top-up tidak tersentuh. Butuh CRON_SECRET di GitHub Secrets.
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: reset-wa-quota
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil endpoint reset kuota
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/wa-quota-reset"
