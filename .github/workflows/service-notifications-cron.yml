name: Drain notifikasi servis

# NOTIFIKASI WHATSAPP SUDAH DIAKTIFKAN.
#
# Jadwal `*/5 * * * *` di bawah menguras outbox tiap 5 menit via GitHub Actions.
# Trigger manual (workflow_dispatch) tetap tersedia.
#
# Kenapa memakai GitHub Actions, bukan cron Vercel: plan Hobby hanya mengizinkan
# cron harian, sedangkan outbox perlu dikuras tiap 5 menit. Jadwal lebih rapat
# di vercel.json membuat BUILD GAGAL validasi dan Vercel diam-diam mempertahankan
# deployment lama (e0b3f86, 28 September 2026).
#
# Sebelum mengaktifkan jadwal ini, expiry baris pending lama di
# cervise_notification_outbox agar notifikasi lama tidak terkirim sekaligus
# (lihat DEPLOY.md bagian "Cron & notifikasi"). Pastikan juga CRON_SECRET ada
# di Settings > Secrets and variables > Actions.
#
# Endpoint-nya sendiri tidak berubah dan tetap diamankan CRON_SECRET.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Jangan menumpuk: satu run sudah mengambil lease di outbox, jadi run
# berikutnya yang tumpang tindih hanya membebani worker tanpa menambah apa pun.
concurrency:
  group: drain-service-notifications
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # Di bawah interval 5 menit supaya run yang menggantung tidak menumpuk
    # dengan run berikutnya.
    timeout-minutes: 4
    steps:
      - name: Panggil endpoint drain outbox
        # Ganti domain kalau project dipindah. Endpoint mengembalikan 401 kalau
        # CRON_SECRET salah, jadi run ini gagal dengan jelas, bukan diam-diam.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS \
            --retry 2 --retry-delay 5 --max-time 200 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://cervise.vercel.app/api/cron/service-notifications" \
            | tee /dev/stderr | tail -c 400
