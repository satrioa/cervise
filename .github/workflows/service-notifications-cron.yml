name: Drain notifikasi servis

# NOTIFIKASI WHATSAPP SEDANG DIMATIKAN.
#
# Tidak ada jadwal otomatis di file ini: blok `schedule:` sengaja dihapus.
# Endpoint dan trigger manual tetap berfungsi sekarang, jadi drain bisa diuji.
#
# Kenapa plan Hobby tidak bisa dipakai: Vercel hanya mengizinkan cron harian,
# sedangkan outbox perlu dikuras tiap 5 menit. Dan jadwal yang lebih rapat
# tidak sekadar dilewati - setiap BUILD GAGAL validasi, lalu Vercel diam-diam
# mempertahankan deployment lama. e0b3f86 menambahkan vercel.json dengan
# `5 * * * *` dan `*/5 * * * *` pada 28 September 2026, dan tidak ada satu pun
# deployment sukses sejak itu. 64b1fb0 tanggal 25 September, yang tidak punya
# vercel.json sama sekali, adalah deployment terakhir yang berhasil.
#
# Cara hidupkan lagi, saat fiturnya mau dikembangkan:
#   1. Tambahkan blok schedule di bawah dengan - cron: "*/5 * * * *"
#   2. Pastikan CRON_SECRET ada di Settings > Secrets and variables > Actions
#   3. Kalau notifikasi tagihan langganan juga mau hidup, kembalikan
#      vercel.json dengan cron harian /api/cron/subscription-renewals
#      (file itu dihapus; ambil dari riwayat git di commit dd98c35)
#   4. Row yang masih pending di cervise_notification_outbox perlu dikexpire
#      dulu. Empat baris servis_created dari 28 September 2026 masih menunggu
#      dan akan terkirim sekaligus begitu dijadwalkan - notifikasi "servis
#      tercatat" yang tiba 20 hari kemudian.
#
# Endpoint-nya sendiri tidak berubah dan tetap diamankan CRON_SECRET, jadi
# trigger manual di bawah ini berfungsi sekarang juga.
on:
  # Sengaja tidak ada `schedule:`. Lihat catatan di atas.
  workflow_dispatch:

# Jangan menumpuk: satu run sudah mengambil lease di outbox, jadi run
# berikutnya yang tumpang tindih hanya membebani worker tanpa menambah apa pun.
concurrency:
  group: drain-service-notifications
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # Di bawah interval 5 menit supaya run yang menggantung tidak menumpuk
    # dengan run berikutnya.
    timeout-minutes: 4
    steps:
      - name: Panggil endpoint drain outbox
        # Ganti domain kalau project dipindah. Endpoint mengembalikan 401 kalau
        # CRON_SECRET salah, jadi run ini gagal dengan jelas, bukan diam-diam.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl -fsS \
            --retry 2 --retry-delay 5 --max-time 200 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://cervise.vercel.app/api/cron/service-notifications" \
            | tee /dev/stderr | tail -c 400
